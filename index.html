<style>
  :root{
    --bg: #060608;
    --bg-glow:
      radial-gradient(ellipse 75% 45% at 15% -8%, rgba(255,45,208,0.16), transparent 60%),
      radial-gradient(ellipse 65% 45% at 100% 0%, rgba(56,189,248,0.13), transparent 55%),
      radial-gradient(ellipse 60% 45% at 50% 105%, rgba(124,63,228,0.12), transparent 62%),
      radial-gradient(ellipse 90% 60% at 50% 40%, rgba(20,10,24,0.4), transparent 70%);
    --panel: rgba(255,255,255,0.045);
    --panel-border: rgba(140,170,255,0.12);
    --card: rgba(255,255,255,0.055);
    --card-border: rgba(140,170,255,0.14);
    --card-drag: rgba(255,255,255,0.09);
    --accent: #ff2dd0;
    --accent2: #38bdf8;
    --accent-grad: linear-gradient(135deg, #ff2dd0, #7c3fe4 55%, #38bdf8);
    --accent-soft: rgba(255,45,208,0.16);
    --text: #f3f5f0;
    --text-dim: #8b9199;
    --text-faint: #565c64;
    --danger: #ff6b6b;
    --radius: 20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html, body, button, h1, h2, p, span, div{
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  textarea, input{
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  html, body{
  margin:0;
  padding:0;
  min-height:100%;
  background-color:var(--bg);
  background-image:var(--bg-glow);
  color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  }
  
  body{
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,45,208,.75) rgba(255,255,255,.08);
  }
  
  body::-webkit-scrollbar,
  #intro::-webkit-scrollbar,
  #listWrap::-webkit-scrollbar{
    width:10px;
  }
  
  body::-webkit-scrollbar-track,
  #intro::-webkit-scrollbar-track,
  #listWrap::-webkit-scrollbar-track{
    background:rgba(255,255,255,.06);
    border-radius:999px;
  }
  
  body::-webkit-scrollbar-thumb,
  #intro::-webkit-scrollbar-thumb,
  #listWrap::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#ff2dd0,#7c3fe4 55%,#38bdf8);
    border-radius:999px;
    border:2px solid transparent;
    background-clip:padding-box;
  }
  
  body::-webkit-scrollbar-thumb:hover,
  #intro::-webkit-scrollbar-thumb:hover,
  #listWrap::-webkit-scrollbar-thumb:hover{
    background:linear-gradient(180deg,#ff69df,#9a63f0 55%,#67d5ff);
    background-clip:padding-box;
  }
  #app{
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- HEADER ---------- */
  header{
    padding: 18px 20px 14px;
    flex-shrink:0;
  }
  header .top-row{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .logo{ width:28px; height:28px; object-fit:contain; flex-shrink:0; }
  header h1{
    font-size: 22px; margin:0; font-weight:800; letter-spacing:-0.5px;
  }
  header .count{
    font-size: 12.5px; color:var(--text-dim); font-weight:600;
    background: var(--panel); border:1px solid var(--panel-border);
    padding:5px 11px; border-radius:999px;
  }
  header p.sub{ margin:4px 0 0; font-size:13px; color:var(--text-faint); }

  /* ---------- INTRO ---------- */
  #intro{
    flex:1; display:flex; flex-direction:column; gap:14px;
    padding:8px 20px 24px; overflow-y:auto;
  }
  .hero{
    padding: 26px 22px 22px;
    text-align:center;
  }
  .hero .icon{
    width:56px; height:56px; margin:0 auto 14px;
    border-radius:16px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .hero .icon svg{ width:26px; height:26px; }
  .hero h2{ font-size:19px; margin:0 0 6px; font-weight:800; letter-spacing:-0.3px; }
  .hero p{ font-size:13.5px; color:var(--text-dim); margin:0; line-height:1.5; max-width:280px; margin:0 auto; }

  textarea{
    width:100%; min-height:150px; resize:vertical;
    background:var(--panel); color:var(--text);
    border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:16px; font-size:15px; line-height:1.5;
    font-family: inherit;
  }
  textarea::placeholder{ color:var(--text-faint); }
  textarea:focus{ outline:none; border-color:rgba(255,45,208,0.35); }

  .filebtn{
    display:flex; align-items:center; justify-content:center; gap:9px;
    background:var(--panel); border:1.5px dashed var(--panel-border);
    border-radius:var(--radius); padding:17px; color:var(--text-dim);
    font-size:14px; font-weight:600; cursor:pointer;
    transition: border-color .15s, background .15s;
  }
  .filebtn.dragover{ border-color:var(--accent); background:var(--accent-soft); color:var(--text); }
  .filebtn input{ display:none; }
  .filebtn svg{ width:17px; height:17px; flex-shrink:0; }

  .primary-btn{
    background:var(--accent-grad); color:#fff; border:none;
    border-radius:var(--radius); padding:16px; font-size:16px; font-weight:800;
    cursor:pointer; letter-spacing:-0.2px;
    transition: transform .1s, opacity .15s;
  }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.3; }

  /* ---------- LISTA ---------- */
  #listWrap{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:4px 14px 24px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,45,208,.75) rgba(255,255,255,.08);
  }
  #list{ position:relative; }

  .card{
    position:absolute; left:0; right:0;
    display:flex; align-items:flex-start; gap:2px;
    background:var(--card); border:1px solid var(--card-border);
    border-radius:16px; padding:12px 10px 12px 4px;
    transition: top .32s cubic-bezier(.34,1.4,.64,1), box-shadow .22s, background .22s, transform .18s;
    will-change: top, transform;
    touch-action: none;
    -webkit-touch-callout: none;
  }
  .card.dragging{
    background:var(--card-drag);
    border-color:rgba(255,45,208,.4);
    box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(56,189,248,.25);
    transition:box-shadow .22s, background .22s;
    z-index:10;
  }
  .idx{
    width:20px; text-align:center; font-size:11px; color:var(--text-faint);
    font-variant-numeric: tabular-nums; flex-shrink:0; padding-top:12px;
    font-weight:700; -webkit-user-select:none; user-select:none;
  }
  .handle{
    flex-shrink:0; width:30px; height:44px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); pointer-events:none;
  }
  .handle svg{ width:15px; height:15px; opacity:0.6; }
  .card.dragging .handle{ color:var(--accent); }
  .txt{
    flex:1; font-size:15px; line-height:1.42;
    word-break:break-word; padding:10px 4px;
    min-width:0; color:var(--text);
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .actions{ display:flex; align-items:center; gap:2px; flex-shrink:0; padding-top:6px; }
  .iconbtn{
    width:34px; height:34px; border-radius:10px;
    background:transparent; border:none;
    color:var(--text-faint); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .iconbtn svg{ width:16px; height:16px; }
  .iconbtn:active{ background:rgba(255,255,255,0.08); color:var(--text); }
  .iconbtn.del:active{ background:rgba(255,107,107,0.15); color:var(--danger); }

  /* ---------- FOOTER ---------- */
  #footer{
    flex-shrink:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(15,17,20,0.85); backdrop-filter: blur(20px);
    border-top:1px solid var(--panel-border);
    display:flex; gap:8px;
  }
  .footbtn{
    flex:1; padding:14px 8px; border-radius:14px; border:1px solid var(--panel-border);
    background:var(--panel); color:var(--text); font-size:13.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .footbtn svg{ width:15px; height:15px; }
  .footbtn.main{ background:var(--accent-grad); color:#fff; border:none; flex:1.3; }
  .footbtn:active{ opacity:0.7; }
  .footbtn.reset{ flex:0 0 46px; color:var(--text-faint); }

  /* ---------- MISC ---------- */
  #toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(16px);
    background:rgba(28,30,34,0.95); backdrop-filter: blur(10px);
    color:#fff; padding:11px 20px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all 0.25s;
    z-index:50; white-space:nowrap; border:1px solid rgba(255,255,255,0.1);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #a2hs{
    display:none; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:14px; padding:11px 14px; margin:0 20px 12px;
    font-size:12.5px; color:var(--text-dim);
  }
  #a2hs.show{ display:flex; }
  #a2hs b{ color:var(--text); }
  #a2hs .close{ margin-left:auto; color:var(--text-faint); font-size:16px; padding:2px 6px; cursor:pointer; }

  .hidden{ display:none !important; }
</style>
</head>

(function(){
  const pasteArea = document.getElementById('pasteArea');
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const startBtn = document.getElementById('startBtn');
  const intro = document.getElementById('intro');
  const listWrap = document.getElementById('listWrap');
  const listEl = document.getElementById('list');
  const footer = document.getElementById('footer');
  const subtitle = document.getElementById('subtitle');
  const countBadge = document.getElementById('countBadge');
  const resetBtn = document.getElementById('resetBtn');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const toastEl = document.getElementById('toast');
  const a2hs = document.getElementById('a2hs');
  const a2hsClose = document.getElementById('a2hsClose');

  let items = []; // {id, text}
  let uid = 0;
  const cardEls = new Map(); // id -> element
  const GAP = 8;

  const AUTOSCROLL_EDGE = 60;       // px dal bordo entro cui parte lo scroll
  const AUTOSCROLL_MAX_SPEED = 12;  // px per frame al massimo (velocità di scroll)
  let autoScrollRAF = null;
  let autoScrollSpeed = 0;
  let autoScrollAccum = 0;          // quanto ha scrollato la lista durante il drag corrente
  
  function stopAutoScroll(){
    if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
    autoScrollSpeed = 0;
  }
  
  function autoScrollStep(onScrolled){
    if (autoScrollSpeed === 0) { autoScrollRAF = null; return; }
    const max = listWrap.scrollHeight - listWrap.clientHeight;
    const prev = listWrap.scrollTop;
    const next = Math.max(0, Math.min(prev + autoScrollSpeed, max));
    if (next !== prev) {
      listWrap.scrollTop = next;
      autoScrollAccum += (next - prev);
      onScrolled();
    }
    autoScrollRAF = requestAnimationFrame(() => autoScrollStep(onScrolled));
  }
  
  function updateAutoScroll(clientY, onScrolled){
    const rect = listWrap.getBoundingClientRect();
    const distTop = clientY - rect.top;
    const distBottom = rect.bottom - clientY;
  
    if (distTop < AUTOSCROLL_EDGE) {
      const ratio = Math.max(0, (AUTOSCROLL_EDGE - distTop) / AUTOSCROLL_EDGE);
      autoScrollSpeed = -ratio * AUTOSCROLL_MAX_SPEED;
    } else if (distBottom < AUTOSCROLL_EDGE) {
      const ratio = Math.max(0, (AUTOSCROLL_EDGE - distBottom) / AUTOSCROLL_EDGE);
      autoScrollSpeed = ratio * AUTOSCROLL_MAX_SPEED;
    } else {
      autoScrollSpeed = 0;
    }
  
    if (autoScrollSpeed !== 0 && !autoScrollRAF) {
      autoScrollRAF = requestAnimationFrame(() => autoScrollStep(onScrolled));
    }
  }

  // ---------------- SCROLL MANUALE DELLA LISTA (con inerzia) ----------------
  // Le card hanno touch-action:none, quindi lo scroll nativo del browser è
  // completamente disattivato su di esse: siamo noi a muovere listWrap.scrollTop
  // a mano. Questo elimina ogni ambiguità/competizione con il drag, che invece
  // funzionava in modo incoerente tra Safari e l'app aggiunta alla Home.
  let momentumRAF = null;
  function stopMomentum(){
    if(momentumRAF){ cancelAnimationFrame(momentumRAF); momentumRAF = null; }
  }
  function startMomentum(initialVelocity){ // px per ms, segno = direzione del dito
    stopMomentum();
    let velocity = initialVelocity;
    let lastTime = performance.now();
    function step(now){
      const dt = Math.min(now - lastTime, 32);
      lastTime = now;
      velocity *= Math.pow(0.94, dt / 16.67);
      listWrap.scrollTop -= velocity * dt;
      const max = listWrap.scrollHeight - listWrap.clientHeight;
      if(listWrap.scrollTop <= 0 || listWrap.scrollTop >= max){
        listWrap.scrollTop = Math.max(0, Math.min(listWrap.scrollTop, max));
        momentumRAF = null;
        return;
      }
      if(Math.abs(velocity) < 0.02){ momentumRAF = null; return; }
      momentumRAF = requestAnimationFrame(step);
    }
    momentumRAF = requestAnimationFrame(step);
  }

  // --- "Add to home screen" hint (only Safari iOS, not already standalone) ---
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  if(isIOS && !isStandalone){
    a2hs.classList.add('show');
  }
  a2hsClose.addEventListener('click', ()=> a2hs.classList.remove('show'));

  // Rete di sicurezza extra: blocca selezione testo e menu contestuale
  // ovunque tranne che nella textarea, indipendentemente dal CSS.
  // Questo evita che il "tieni premuto" per trascinare le card apra
  // il popup di selezione/copia di iOS, che altrimenti manda in conflitto
  // il riconoscimento del drag.
  document.addEventListener('selectstart', (e)=>{
    const tag = e.target.tagName;
    if(tag === 'TEXTAREA' || tag === 'INPUT') return;
    e.preventDefault();
  });
  document.addEventListener('contextmenu', (e)=>{
    const tag = e.target.tagName;
    if(tag === 'TEXTAREA' || tag === 'INPUT') return;
    e.preventDefault();
  });

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1500);
  }

  function loadFile(f){
    if(!f) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      pasteArea.value = ev.target.result;
      if(subtitle) subtitle.textContent = 'File caricato: ' + f.name;
    };
    reader.onerror = ()=>{
      toast('Non riesco a leggere il file, prova a incollare il testo');
    };
    reader.readAsText(f, 'UTF-8');
  }
  fileInput.addEventListener('change', (e)=> loadFile(e.target.files[0]));
  ['dragover','dragenter'].forEach(ev => fileLabel.addEventListener(ev, (e)=>{ e.preventDefault(); fileLabel.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(ev => fileLabel.addEventListener(ev, (e)=>{ e.preventDefault(); fileLabel.classList.remove('dragover'); }));
  fileLabel.addEventListener('drop', (e)=>{ if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  function createCards(){
    const lines = pasteArea.value.split(/\r\n|\r|\n/).filter(l => l.trim().length > 0);
    if(lines.length === 0){ toast('Incolla o carica del testo prima di continuare'); return; }
    items = lines.map(text => ({ id: uid++, text }));
    intro.classList.add('hidden');
    listWrap.classList.remove('hidden');
    footer.classList.remove('hidden');
    countBadge.classList.remove('hidden');
    buildAllCards();
    layout(true);
    updateHeader();
  }
  // click copre mouse/trackpad, touchend è un fallback extra per Safari iOS
  // in modo che il tocco funzioni anche se il "click" sintetico è in ritardo o bloccato.
  let startFired = false;
  startBtn.addEventListener('click', ()=>{ if(startFired) return; startFired = true; createCards(); setTimeout(()=>startFired=false, 400); });
  startBtn.addEventListener('touchend', (e)=>{ e.preventDefault(); if(startFired) return; startFired = true; createCards(); setTimeout(()=>startFired=false, 400); });

  resetBtn.addEventListener('click', ()=>{
    if(items.length && !confirm('Ricominciare da capo? Le modifiche andranno perse.')) return;
    items = [];
    cardEls.clear();
    listEl.innerHTML = '';
    pasteArea.value = '';
    startBtn.disabled = true;
    intro.classList.remove('hidden');
    listWrap.classList.add('hidden');
    footer.classList.add('hidden');
    countBadge.classList.add('hidden');
    if(subtitle) subtitle.textContent = 'Incolla del testo o carica un file, poi trascina per riordinare';
  });

  function updateHeader(){
    countBadge.textContent = items.length + (items.length===1 ? ' riga' : ' righe');
    if(subtitle) subtitle.textContent = 'Tieni premuto su una card e trascina per riordinare';
  }

  function currentText(){
    return items.map(it => it.text).join('\n');
  }

  copyBtn.addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(currentText());
      toast('Copiato negli appunti ✓');
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = currentText();
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('Copiato ✓');
    }
  });

  downloadBtn.addEventListener('click', ()=>{
    const blob = new Blob([currentText()], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'righe-riordinate.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Scaricato ✓');
  });

  // ---------------- CARD BUILD ----------------
  function buildAllCards(){
    listEl.innerHTML = '';
    cardEls.clear();
    items.forEach(it => {
      const el = buildCard(it);
      cardEls.set(it.id, el);
      listEl.appendChild(el);
    });
  }

  function buildCard(it){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = it.id;

    const idxEl = document.createElement('div');
    idxEl.className = 'idx';

    const handle = document.createElement('div');
    handle.className = 'handle';
    handle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="7" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="9" cy="17" r="1.3"/><circle cx="15" cy="7" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="15" cy="17" r="1.3"/></svg>';

    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = it.text;

    const actions = document.createElement('div');
    actions.className = 'actions';
    const delBtn = document.createElement('div');
    delBtn.className = 'iconbtn del';
    delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
    delBtn.addEventListener('click', ()=>{
      const el = cardEls.get(it.id);
      el.style.transition = 'top .32s cubic-bezier(.34,1.4,.64,1), opacity .18s, transform .18s';
      el.style.opacity = '0';
      el.style.transform = 'scale(0.9)';
      items = items.filter(x=>x.id!==it.id);
      setTimeout(()=>{
        el.remove();
        cardEls.delete(it.id);
        layout(true);
        updateHeader();
      }, 160);
    });

    actions.appendChild(delBtn);

    card.appendChild(idxEl);
    card.appendChild(handle);
    card.appendChild(txt);
    card.appendChild(actions);

    attachDrag(card, txt, it);

    return card;
  }

  // ---------------- LAYOUT (absolute positioning, FLIP-style) ----------------
  function layout(animate, skipId){
    let top = 0;
    items.forEach((it, idx)=>{
      const el = cardEls.get(it.id);
      if(!el) return;
      const idxEl = el.querySelector('.idx');
      if(idxEl) idxEl.textContent = idx + 1;
      if(el.dataset.id != skipId){
        if(!animate) el.style.transition = 'none';
        el.style.top = top + 'px';
        if(!animate){
          // force reflow then restore transition
          void el.offsetHeight;
          el.style.transition = '';
        }
      }
      el.style.height = 'auto';
      const h = el.getBoundingClientRect().height;
      el._height = h;
      top += h + GAP;
    });
    listEl.style.height = Math.max(top - GAP, 0) + 'px';
  }

  function getHeight(el){
    return el._height || el.getBoundingClientRect().height;
  }

  // ---------------- DRAG (da qualsiasi punto della card, con pressione prolungata) ----------------
  // La card mostra solo testo (non modificabile): un tocco fermo per ~230ms
  // "afferra" la card e blocca lo scroll della lista, così puoi spostarla
  // liberamente. Un movimento prima di quel momento viene interpretato come
  // scroll della lista, gestito interamente a mano (vedi sopra) — niente più
  // scroll nativo del browser da cui "riprendersi" il controllo, quindi
  // nessuna differenza di comportamento tra Safari e app aggiunta alla Home.
  const LONG_PRESS_MS = 230;
  const MOVE_CANCEL_PX = 8;

  function attachDrag(card, txt, it){
    let longPressTimer = null;
    let dragging = false;
    let scrolling = false;
    let pointerId = null;
    let startClientY = 0, startTop = 0, startScrollTop = 0;
    let lastDy = 0;
    let lastSampleT = 0, lastSampleY = 0, velocity = 0;
    let startOffsetInCard = 0;

    card.addEventListener('pointerdown', (e)=>{
      if(e.target.closest('.actions')) return; // il tasto elimina resta indipendente
      if(e.pointerType === 'mouse' && e.button !== 0) return;

      stopMomentum();

      pointerId = e.pointerId;
      startClientY = e.clientY;
      startTop = parseFloat(card.style.top) || 0;
      startScrollTop = listWrap.scrollTop;
      const wrapRect = listWrap.getBoundingClientRect();
      const pointerInListAtStart = (e.clientY - wrapRect.top) + listWrap.scrollTop;
      startOffsetInCard = pointerInListAtStart - startTop;
      dragging = false;
      scrolling = false;
      lastDy = 0;
      lastSampleT = performance.now();
      lastSampleY = e.clientY;
      velocity = 0;

      const beginDrag = ()=>{
        // Ricontrolliamo la posizione reale del dito proprio ora, invece di
        // fidarci solo del fatto che onMove non abbia ancora annullato il
        // timer: elimina ogni finestra di corsa (race condition) tra timer
        // ed evento di movimento.
        if (scrolling || Math.abs(lastDy) > MOVE_CANCEL_PX) return;
        dragging = true;
        autoScrollAccum = 0;   // <-- RIGA AGGIUNTA
        try { card.setPointerCapture(pointerId); } catch(err) {}
        card.classList.add('dragging');
        card.style.transition = 'box-shadow .22s, background .22s, transform .18s';
        if(navigator.vibrate) navigator.vibrate(8);
      };

      longPressTimer = setTimeout(beginDrag, LONG_PRESS_MS);

      const onMove = (ev)=>{
        if(ev.pointerId !== pointerId) return;
        const dy = ev.clientY - startClientY;
        lastDy = dy;

        if (dragging) {
          // --- TRASCINAMENTO: la card segue il dito, la lista si auto-scrolla ai bordi ---
          ev.preventDefault();
        
          const recomputeTop = () => {
            const wrapRect = listWrap.getBoundingClientRect();
            const pointerInList = (ev.clientY - wrapRect.top) + listWrap.scrollTop;
            let t = pointerInList - startOffsetInCard;
            t = Math.max(0, Math.min(t, listEl.offsetHeight - getHeight(card)));
            card.style.top = t + 'px';
            return t;
          };
        
          let newTop = recomputeTop();
          updateAutoScroll(ev.clientY, () => { newTop = recomputeTop(); });
        
          const curIdx = items.findIndex(x => x.id === it.id);
          const cardCenter = newTop + getHeight(card) / 2;
          const targetIdx = computeTargetIndex(it.id, cardCenter);
          if (targetIdx !== curIdx) {
            const [movedItem] = items.splice(curIdx, 1);
            items.splice(targetIdx, 0, movedItem);
            layout(true, it.id);
            items.forEach((x, i) => {
              const e2 = cardEls.get(x.id);
              if (e2) { const ie = e2.querySelector('.idx'); if (ie) ie.textContent = i + 1; }
            });
          }
          return;
        }

        if(!scrolling){
          if(Math.abs(dy) <= MOVE_CANCEL_PX) return; // fermo: aspettiamo il long-press
          // movimento deciso prima che scatti la pressione prolungata -> è
          // uno scroll della lista, non un drag.
          scrolling = true;
          clearTimeout(longPressTimer);
        }

        // --- SCROLL MANUALE: la card resta ferma, si muove la lista ---
        ev.preventDefault();
        listWrap.scrollTop = startScrollTop - dy;

        const now = performance.now();
        const dt = now - lastSampleT;
        if(dt > 0){ velocity = (ev.clientY - lastSampleY) / dt; }
        lastSampleT = now;
        lastSampleY = ev.clientY;
      };

      const onUp = (ev)=>{
        if(ev.pointerId !== pointerId) return;
        clearTimeout(longPressTimer);
        stopAutoScroll();
        if(dragging){
          try{ card.releasePointerCapture(pointerId); }catch(err){}
          card.classList.remove('dragging');
          card.style.transition = 'top .32s cubic-bezier(.34,1.4,.64,1), box-shadow .22s, background .22s, transform .18s';
          card.style.transform = '';
          layout(true);
        } else if(scrolling && Math.abs(velocity) > 0.03){
          startMomentum(velocity);
        }
        dragging = false;
        scrolling = false;
        cleanup();
      };

      function cleanup(){
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  }

  // Counts how many "other" cards (in their current laid-out order) the
  // dragged card's center has passed — that count is exactly its new index.
  function computeTargetIndex(draggedId, draggedCenter){
    let cum = 0;
    let count = 0;
    for(let i=0;i<items.length;i++){
      if(items[i].id === draggedId) continue;
      const el = cardEls.get(items[i].id);
      const h = getHeight(el);
      const center = cum + h/2;
      if(draggedCenter > center) count++;
      cum += h + GAP;
    }
    return count;
  }

  window.addEventListener('resize', ()=>{ if(items.length) layout(false); });

})();
</script>
</body>
</html>
